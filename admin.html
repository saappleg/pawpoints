<!DOCTYPE html>
<html lang="en" x-data="adminApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pet Care by Steven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-md space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h2 class="font-black text-xl">👑 Admin Portal</h2>
            <a href="portal.html" class="text-xs bg-gray-200 px-3 py-1.5 rounded font-bold">← Back to Portal</a>
        </div>

        <div class="space-y-4 text-xs">
            <button @click="exportWalkiesCSV()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">📥 Download Walkies Client CSV Export</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E", authDomain: "paw-points-app.firebaseapp.com", projectId: "paw-points-app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function adminApp() {
            return {
                async exportWalkiesCSV() {
                    const snap = await db.collection('clients').get();
                    let csv = "Name,Email,Phone,Address\r\n";
                    snap.forEach(doc => {
                        const d = doc.data();
                        csv += `"${d.name}","${d.email}","${d.phone || ''}","${d.address || ''}"\r\n`;
                    });
                    const link = document.createElement("a");
                    link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv));
                    link.setAttribute("download", "walkies_export.csv");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        }
    </script>
</body>
</html>
