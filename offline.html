<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Pet Care by Steven</title>
    <link rel="stylesheet" href="/output.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white dark:bg-gray-800 p-10 rounded-3xl shadow-xl text-center max-w-md border border-gray-100 dark:border-gray-700">
        <div class="text-6xl mb-4">🐾</div>
        <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-2">You are currently offline</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-6">
            It looks like you've lost your internet connection. Please check your network and refresh the page to access your Paw Points dashboard and schedule visits.
        </p>
        <button onclick="window.location.reload()" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl transition shadow-md">
            Try Again
        </button>
    </div>
</body>
</html>
