<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4f46e5">
  <title>Page not found | Pet Care by Steven</title>
  <script>
    (() => {
      const preference = localStorage.getItem('themePreference') || 'system';
      const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    :root { color-scheme: light; --page: #f8fafc; --card: #fff; --text: #111827; --muted: #64748b; --border: #e2e8f0; --soft: #eef2ff; --shadow: #0f172a1f; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #0d1117; --card: #111827; --text: #f8fafc; --muted: #cbd5e1; --border: #334155; --soft: #1e293b; --shadow: #0008; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 680px); padding: clamp(32px, 7vw, 56px); text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 30px; box-shadow: 0 24px 60px var(--shadow); }
    img { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 12px 28px var(--shadow); }
    .eyebrow { margin-top: 18px; color: #6366f1; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; font-size: .75rem; }
    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
    p { max-width: 490px; margin: 0 auto 28px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 19px; border-radius: 14px; color: #fff; text-decoration: none; font-weight: 800; background: #4f46e5; }
    a:hover { background: #4338ca; }
    a.secondary { color: var(--text); background: var(--soft); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <main>
    <img src="/android-chrome-192x192.webp" alt="Pet Care by Steven logo" width="84" height="84">
    <div class="eyebrow">Pet Care by Steven</div>
    <h1>This page wandered off.</h1>
    <p>The address may have changed, but pet services, care plans, and the Paw Points portal are right where you left them.</p>
    <div class="actions">
      <a href="/">Return home</a>
      <a class="secondary" href="/?view=home#care-plan">Request a care plan</a>
    </div>
  </main>
</body>
</html>
