<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paw Points 🐾 | Pet Sitting Loyalty</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Firebase Web SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 font-sans" x-data="pawPointsApp()">

  <!-- Navigation -->
  <header class="bg-white border-b border-amber-200 shadow-sm sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-3xl">🐾</span>
        <h1 class="text-xl font-bold text-amber-900">Paw Points</h1>
      </div>
      <template x-if="user">
        <div class="flex items-center space-x-3">
          <span class="text-xs bg-amber-100 text-amber-900 font-medium px-3 py-1 rounded-full" x-text="user.email"></span>
          <button @click="logout()" class="text-xs text-rose-600 hover:underline font-semibold">Log Out</button>
        </div>
      </template>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">

    <!-- AUTHENTICATION FORM (LOG IN / SIGN UP) -->
    <template x-if="!user">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-amber-100 max-w-md mx-auto">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-1" x-text="isSignUp ? 'Create Account' : 'Welcome Back'"></h2>
        <p class="text-slate-500 text-xs text-center mb-6" x-text="isSignUp ? 'Sign up to start earning Paw Points' : 'Log in to view your balance and pets'"></p>

        <form @submit.prevent="handleAuth()" class="space-y-4">
          <template x-if="isSignUp">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Your Full Name</label>
              <input type="text" x-model="authName" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="e.g. Alex Smith" />
            </div>
          </template>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
            <input type="email" x-model="authEmail" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="you@example.com" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
            <input type="password" x-model="authPassword" required class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="••••••••" />
          </div>

          <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-xl text-sm transition-colors" x-text="isSignUp ? 'Register Account' : 'Log In'"></button>
        </form>

        <p class="text-xs text-center text-slate-500 mt-6">
          <span x-text="isSignUp ? 'Already have an account?' : 'Need an account?'"></span>
          <button @click="isSignUp = !isSignUp" class="text-amber-700 font-bold hover:underline ml-1" x-text="isSignUp ? 'Log In' : 'Sign Up'"></button>
        </p>
      </div>
    </template>

    <!-- CLIENT DASHBOARD -->
    <template x-if="user">
      <div class="space-y-6">

        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center">
          <div>
            <p class="text-amber-100 text-xs font-medium uppercase tracking-wider">Account Balance</p>
            <h3 class="text-3xl font-extrabold mt-1" x-text="(userData?.points || 0).toLocaleString() + ' 🐾'"></h3>
            <p class="text-amber-100 text-xs mt-1" x-text="'10 points per $1 spent'"></p>
          </div>
          <div class="text-right">
            <span class="text-xs bg-white/20 text-white px-3 py-1 rounded-full font-medium" x-text="userData?.name || 'Valued Client'"></span>
          </div>
        </div>

        <!-- PET INFORMATION SECTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
              <span>🐶🐱 My Pets</span>
            </h3>
            <button @click="showAddPet = !showAddPet" class="text-xs bg-amber-100 text-amber-900 font-semibold px-3 py-1.5 rounded-lg hover:bg-amber-200 transition-colors">
              <span x-text="showAddPet ? 'Cancel' : '+ Add Pet'"></span>
            </button>
          </div>

          <!-- Add Pet Form -->
          <div x-show="showAddPet" class="bg-amber-50/60 p-4 rounded-xl border border-amber-200 mb-4 space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <input type="text" x-model="newPet.name" placeholder="Pet Name (e.g. Fizz)" class="px-3 py-2 border border-slate-300 rounded-lg text-sm" />
              <input type="text" x-model="newPet.type" placeholder="Type / Breed (e.g. Cat, Tabby)" class="px-3 py-2 border border-slate-300 rounded-lg text-sm" />
            </div>
            <textarea x-model="newPet.notes" placeholder="Care notes, dietary info, or fun quirks..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" rows="2"></textarea>
            <button @click="savePet()" class="bg-amber-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium hover:bg-amber-700">Save Pet</button>
          </div>

          <!-- Pet Cards List -->
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="pet in userData?.pets || []" :key="pet.name">
              <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50 flex justify-between items-start">
                <div>
                  <h4 class="font-bold text-slate-800" x-text="pet.name"></h4>
                  <p class="text-xs text-amber-800 font-medium" x-text="pet.type"></p>
                  <p class="text-xs text-slate-500 mt-2 italic" x-text="pet.notes || 'No notes added.'"></p>
                </div>
              </div>
            </template>
            <template x-if="!userData?.pets?.length">
              <p class="text-xs text-slate-400 italic">No pets added yet. Click "+ Add Pet" to tell us about your furry friends!</p>
            </template>
          </div>
        </div>

        <!-- REWARD REDEMPTION -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
          <h3 class="font-bold text-lg text-slate-800 mb-4">Available Rewards</h3>
          <div class="grid md:grid-cols-2 gap-4">
            
            <!-- $10 Off -->
            <div class="border border-slate-200 p-4 rounded-xl flex flex-col justify-between" :class="{'border-amber-500 bg-amber-50/40': (userData?.points || 0) >= 5000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800">$10 Off Next Sit</span>
                  <span class="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-semibold">5,000 pts</span>
                </div>
                <p class="text-xs text-slate-500">Requires $500 total spent in Walkies.</p>
              </div>
              <button 
                @click="redeemReward(5000, '$10 Off')"
                :disabled="(userData?.points || 0) < 5000"
                :class="(userData?.points || 0) >= 5000 ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'"
                class="mt-4 w-full py-2 rounded-lg font-medium text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

            <!-- $20 Off -->
            <div class="border border-slate-200 p-4 rounded-xl flex flex-col justify-between" :class="{'border-amber-500 bg-amber-50/40': (userData?.points || 0) >= 8000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800">$20 Off Next Sit</span>
                  <span class="text-xs bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-semibold">8,000 pts</span>
                </div>
                <p class="text-xs text-slate-500">Best value! Requires $800 total spent.</p>
              </div>
              <button 
                @click="redeemReward(8000, '$20 Off')"
                :disabled="(userData?.points || 0) < 8000"
                :class="(userData?.points || 0) >= 8000 ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'"
                class="mt-4 w-full py-2 rounded-lg font-medium text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

          </div>
        </div>

      </div>
    </template>

  </main>

  <script>
    // Your exact Firebase configuration keys
    const firebaseConfig = {
      apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E",
      authDomain: "paw-points-app.firebaseapp.com",
      projectId: "paw-points-app",
      storageBucket: "paw-points-app.firebasestorage.app",
      messagingSenderId: "252239990659",
      appId: "1:252239990659:web:627f4bd85785e0bdcfb0b6",
      measurementId: "G-6MPSER0Z6L"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function pawPointsApp() {
      return {
        user: null,
        userData: null,
        isSignUp: false,
        authName: '',
        authEmail: '',
        authPassword: '',
        showAddPet: false,
        newPet: { name: '', type: '', notes: '' },

        init() {
          auth.onAuthStateChanged(async (u) => {
            this.user = u;
            if (u) {
              this.fetchUserData();
            } else {
              this.userData = null;
            }
          });
        },

        async fetchUserData() {
          const doc = await db.collection('clients').doc(this.user.uid).get();
          if (doc.exists) {
            this.userData = doc.data();
          }
        },

        async handleAuth() {
          try {
            if (this.isSignUp) {
              const res = await auth.createUserWithEmailAndPassword(this.authEmail, this.authPassword);
              await db.collection('clients').doc(res.user.uid).set({
                name: this.authName,
                email: this.authEmail,
                points: 0,
                pets: []
              });
            } else {
              await auth.signInWithEmailAndPassword(this.authEmail, this.authPassword);
            }
          } catch (err) {
            alert(err.message);
          }
        },

        async savePet() {
          if (!this.newPet.name) return alert('Pet name is required.');
          const pets = this.userData.pets || [];
          pets.push({ ...this.newPet });

          await db.collection('clients').doc(this.user.uid).update({ pets });
          this.userData.pets = pets;
          this.newPet = { name: '', type: '', notes: '' };
          this.showAddPet = false;
        },

        async redeemReward(cost, rewardName) {
          if (this.userData.points >= cost) {
            const newPoints = this.userData.points - cost;
            await db.collection('clients').doc(this.user.uid).update({ points: newPoints });
            this.userData.points = newPoints;
            alert(`Successfully redeemed ${rewardName}! Let us know when booking in Walkies.`);
          }
        },

        logout() {
          auth.signOut();
        }
      };
    }
  </script>
</body>
</html>
