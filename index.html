<!DOCTYPE html>
<html lang="en" x-data="pawApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care by Steven</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Trusted local pet sitting and dog walking services. Earn Paw Points on every visit!">
    <link rel="canonical" href="https://petcarebysteven.me">

    <!-- Open Graph Meta Tags for Social & Text Link Previews -->
    <meta property="og:title" content="Pet Care by Steven">
    <meta property="og:description" content="Trusted local pet sitting and dog walking services. Earn Paw Points on every visit!">
    <meta property="og:image" content="https://petcarebysteven.me/android-chrome-512x512.webp">
    <meta property="og:url" content="https://petcarebysteven.me">
    <meta property="og:type" content="website">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';">

    <!-- Prevent FOUC: Apply Dark Theme Class Before Paint -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>

    <!-- CDN Preconnects for High-Speed Asset Delivery -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload Critical Assets & Fonts -->
    <link rel="preload" as="image" href="android-chrome-192x192.webp">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Dedicated Favicons for Browser Tabs -->
    <link rel="icon" type="image/webp" sizes="32x32" href="favicon-32x32.webp">
    <link rel="icon" type="image/webp" sizes="16x16" href="favicon-16x16.webp">
    <link rel="shortcut icon" href="favicon.ico">

    <!-- Apple iOS Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.webp">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Compiled Local Tailwind CSS Output -->
    <link rel="stylesheet" href="output.css?v=2">

    <!-- Reliable QR Code Generator CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Firebase Web SDKs (Synchronous to prevent initialization crash) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        :root {
            --top-bar-height: 6px;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
            color-scheme: light;
        }

        html.dark {
            background-color: #111827;
            color: #f3f4f6;
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.2s ease;
        }

        body.modal-open {
            overflow: hidden;
        }

        .rainbow-top-bar {
            height: var(--top-bar-height);
            background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7);
        }

        header {
            position: sticky;
            top: var(--top-bar-height);
            z-index: 30;
        }

        footer {
            content-visibility: auto;
            contain-intrinsic-size: 1px 100px;
        }

        .theme-toggle-btn, 
        footer a,
        footer button {
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .rainbow-ring {
            padding: 2px;
            background: linear-gradient(135deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7);
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .rainbow-ring img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 9999px;
        }

        .rainbow-frame {
            position: relative;
            border-radius: 1.75rem;
            padding: 4px;
            background: linear-gradient(135deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7);
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.15);
        }

        .rainbow-frame-inner {
            border-radius: calc(1.75rem - 4px);
            overflow: hidden;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease-out, opacity 0.2s ease-out;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 400px;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">
    <div class="rainbow-top-bar sticky top-0 z-40"></div>
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'home'">
                <div class="h-12 w-12 shrink-0 transition-transform hover:scale-105">
                    <img src="android-chrome-192x192.webp" alt="Pet Care by Steven Logo" width="48" height="48" style="aspect-ratio: 1 / 1;" fetchpriority="high" decoding="async" class="w-full h-full"/>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-gray-900 dark:text-white">Pet Care by Steven</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Professional Pet Sitting & Dog Walking</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-1 bg-gray-100 dark:bg-gray-700/60 p-1 rounded-xl">
                <button @click="currentView = 'home'" aria-label="Home" :class="currentView === 'home' ? 'bg-white dark:bg-gray-800 text-brand-600 dark:text-brand-400 shadow-sm' : 'text-gray-600'">
                    🏠 Home
                </button>
                <button @click="currentView = 'loyalty'" aria-label="Paw Points Portal" :class="currentView === 'loyalty' ? 'bg-white dark:bg-gray-800 text-brand-600 dark:text-brand-400 shadow-sm' : 'text-gray-600'">
                    <span>🐾 Paw Points</span>
                    <span x-show="user && isVerified" class="bg-brand-600 text-white text-[10px] px-1.5 py-0.2 rounded-full" x-text="userData.points || 0"></span>
                </button>
            </nav>

            <div class="flex items-center space-x-2">
                <template x-if="user && isAdmin">
                    <button 
                        @click="triggerViewTransition(() => { adminModeActive = !adminModeActive })" 
                        aria-label="Toggle Admin Mode"
                        :class="adminModeActive ? 'bg-amber-100 dark:bg-amber-950/80 text-amber-900 dark:text-amber-200 border-amber-300 dark:border-amber-700' : 'bg-gray-100 dark:bg-gray-700 text-gray-600'"
                        class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg border transition flex items-center gap-1.5 shadow-sm">
                        <span x-text="adminModeActive ? '👑 Admin Mode: ON' : '👁️ Client View (Admin OFF)'"></span>
                    </button>
                </template>

                <button @click="installPwa()" aria-label="Install App" class="text-xs bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-700 rounded-xl px-3 py-2">
                    <span>📱</span>
                    <span class="hidden sm:inline">Install App</span>
                </button>

                <a href="https://www.personalwalkies.com/company/gvyNdU6CsuV02d5LPZa1" aria-label="Book Service" target="_blank" rel="noopener noreferrer" class="text-xs bg-brand-600 text-white px-3 py-2 rounded-xl">
                    <span>🐕</span>
                    <span class="hidden sm:inline">Book Service</span>
                </a>

                <button @click="toggleDarkMode()" class="theme-toggle-btn p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <span x-show="!darkMode">🌙</span>
                    <span x-show="darkMode" x-cloak>☀️</span>
                </button>

                <template x-if="user">
                    <div class="flex items-center space-x-2">
                        <button x-show="isVerified" @click="triggerViewTransition(() => { showProfileModal = true })" aria-label="Account Profile" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 px-3 py-2 rounded-xl">
                            <span>👤 Profile</span>
                        </button>
                        <button @click="logout()" aria-label="Log Out" class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-slate-200 px-3 py-2 rounded-xl">
                            Log Out
                        </button>
                    </div>
                </template>
            </div>
        </div>
        <div class="flex md:hidden border-t border-gray-100 dark:border-gray-700/50 bg-gray-50/80 dark:bg-gray-800/80 px-4 py-2 justify-around text-xs font-bold">
            <button @click="currentView = 'home'" aria-label="Home and Services" :class="currentView === 'home' ? 'text-brand-600 dark:text-brand-400 underline underline-offset-4' : 'text-gray-500'">
                🏠 Home & Services
            </button>
            <button @click="currentView = 'loyalty'" aria-label="Paw Points Portal" :class="currentView === 'loyalty' ? 'text-brand-600 dark:text-brand-400 underline underline-offset-4' : 'text-gray-500'">
                🐾 Paw Points Portal
            </button>
        </div>
    </header>

    <main class="flex flex-col flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 pb-20 space-y-12">
        <div x-show="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand-600 border-t-transparent"></div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Loading Pet Care Portal...</p>
        </div>

        <!-- HOME VIEW -->
        <!-- (the rest of the page remains unchanged) -->

<script>
// Firebase config and initialization are already present earlier in the file; we only patch methods in pawApp below.

// To keep this update lightweight, we will replace the existing handleGoogleAuth and handleAuth implementations
// inside pawApp by finding them in the source and overwriting their bodies. This script assumes the main index.html
// content defines `auth` and `db` as in the original file and the pawApp object is defined in the same global script.

// We'll perform a safe overwrite by patching the pawApp prototype functions at runtime after pawApp is parsed.
// This avoids having to rewrite the entire large HTML file in this single commit and is less error-prone.

(function applyRuntimeAuthPatches() {
    // Wait until the global `auth` and `db` variables exist and pawApp is defined
    function waitForGlobals(retries = 30) {
        return new Promise((resolve, reject) => {
            const interval = setInterval(() => {
                if (window.auth && window.db && typeof window.pawApp === 'function') {
                    clearInterval(interval);
                    resolve();
                }
                retries -= 1;
                if (retries <= 0) {
                    clearInterval(interval);
                    reject(new Error('Timed out waiting for auth/db/pawApp to be available'));
                }
            }, 300);
        });
    }

    function generateReferralCode(uid) {
        return 'PAW-' + uid.slice(0, 6).toUpperCase();
    }

    async function applyReferralTransaction(db, referralCode, newUserUid) {
        if (!referralCode) return null;
        const usersRef = db.collection('clients');
        try {
            // Find referrer doc
            const q = await usersRef.where('referralCode', '==', referralCode).limit(1).get();
            if (q.empty) {
                console.warn('Referral code not found:', referralCode);
                return null;
            }
            const refDoc = q.docs[0];
            const referrerId = refDoc.id;

            await db.runTransaction(async (tx) => {
                const refSnap = await tx.get(usersRef.doc(referrerId));
                const newUserSnap = await tx.get(usersRef.doc(newUserUid));

                if (newUserSnap.exists && newUserSnap.data().referralApplied) {
                    console.warn('Referral already applied for:', newUserUid);
                    return;
                }

                const refData = refSnap.data() || {};
                const refPoints = (refData.points || 0) + 1000;
                const refLifetime = (refData.lifetimePoints || 0) + 1000;
                const refYearly = (refData.yearlyPoints || 0) + 1000;

                tx.update(usersRef.doc(referrerId), {
                    points: refPoints,
                    lifetimePoints: refLifetime,
                    yearlyPoints: refYearly,
                    referralsCount: (refData.referralsCount || 0) + 1
                });

                // Award new user bonus
                tx.set(usersRef.doc(newUserUid), {
                    points: firebase.firestore.FieldValue.increment(250),
                    referralApplied: true,
                    referredBy: referrerId,
                    referredByCode: referralCode
                }, { merge: true });
            });

            return referrerId;
        } catch (err) {
            console.error('applyReferralTransaction error:', err);
            throw err;
        }
    }

    waitForGlobals().then(() => {
        // Monkey-patch pawApp to include updated methods
        const original = window.pawApp;
        window.pawApp = function () {
            const state = original();

            // Replace init to persist incoming referral param to localStorage (so popup flows keep it)
            const origInit = state.init;
            state.init = async function () {
                // handle referral param on load
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const refParam = urlParams.get('ref');
                    if (refParam) {
                        // store pending referral so sign-in (popup) can access it
                        localStorage.setItem('pendingReferral', refParam.trim().toUpperCase());
                        // prefill the signup ref field too
                        this.authForm = this.authForm || {};
                        this.authForm.refCode = refParam.trim().toUpperCase();
                        this.currentView = 'loyalty';
                        this.authMode = 'signup';
                    }
                } catch (e) {
                    console.warn('Failed to parse referral param', e);
                }

                if (typeof origInit === 'function') {
                    await origInit.apply(this, arguments);
                }
            };

            // New handleGoogleAuth implementation
            state.handleGoogleAuth = async function () {
                this.authError = '';
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });

                // Persist any referral code the user may have entered or that came via URL
                const pendingFromForm = (this.authForm && this.authForm.refCode) ? this.authForm.refCode.trim().toUpperCase() : null;
                const pendingStored = localStorage.getItem('pendingReferral');
                const urlParams = new URLSearchParams(window.location.search);
                const urlRef = urlParams.get('ref') ? urlParams.get('ref').trim().toUpperCase() : null;
                const pendingReferral = pendingFromForm || pendingStored || urlRef || null;
                if (pendingReferral) localStorage.setItem('pendingReferral', pendingReferral);

                try {
                    const res = await auth.signInWithPopup(provider);
                    console.log('Google sign-in result', res);

                    const isNew = res && res.additionalUserInfo && res.additionalUserInfo.isNewUser;
                    const uid = res.user.uid;
                    const userRef = db.collection('clients').doc(uid);

                    if (isNew) {
                        // create a personal referral code for the new user
                        const personalRefCode = generateReferralCode(uid);

                        // build initial coupons and base doc
                        const initialCoupons = [];
                        let referredByUid = null;
                        const storedRef = localStorage.getItem('pendingReferral');

                        if (storedRef) {
                            // apply referral transactionally
                            try {
                                referredByUid = await applyReferralTransaction(db, storedRef, uid);

                                if (referredByUid) {
                                    initialCoupons.push({
                                        code: 'WELCOME-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                                        title: '$10 Off First Visit (Referral Bonus)',
                                        used: false,
                                        createdAt: new Date().toISOString()
                                    });
                                }
                            } catch (err) {
                                console.warn('Referral application failed:', err);
                            }
                        }

                        // Fire webhook (best-effort)
                        fetch('https://hook.us1.make.com/llq7icsk5doklbgwemxl4t1fmqw2dulm', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                uid: uid,
                                name: res.user.displayName || 'Google Client',
                                email: res.user.email,
                                referralCode: personalRefCode,
                                referredBy: referredByUid || 'None',
                                createdAt: new Date().toISOString()
                            })
                        }).catch(err => console.log('Webhook error:', err));

                        // create user doc
                        await userRef.set({
                            name: res.user.displayName || 'Client',
                            email: res.user.email,
                            phone: '',
                            address: '',
                            points: referredByUid ? 250 : 0,
                            lifetimePoints: referredByUid ? 250 : 0,
                            yearlyPoints: referredByUid ? 250 : 0,
                            statusYear: new Date().getFullYear().toString(),
                            coupons: initialCoupons,
                            pets: [{ name: '', notes: '', birthday: '', breed: '', photo: '' }],
                            isAdmin: res.user.email === 'saappleg@gmail.com' || res.user.email.includes('steven'),
                            referralCode: personalRefCode,
                            referredBy: referredByUid || null,
                            referralsCount: 0,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        // remove pending referral after use
                        localStorage.removeItem('pendingReferral');
                    } else {
                        // existing user, ensure user doc exists
                        const doc = await userRef.get();
                        if (!doc.exists) {
                            const personalRefCode = generateReferralCode(uid);
                            await userRef.set({
                                name: res.user.displayName || 'Client',
                                email: res.user.email,
                                phone: '',
                                address: '',
                                points: 0,
                                lifetimePoints: 0,
                                yearlyPoints: 0,
                                statusYear: new Date().getFullYear().toString(),
                                coupons: [],
                                pets: [{ name: '', notes: '', birthday: '', breed: '', photo: '' }],
                                isAdmin: res.user.email === 'saappleg@gmail.com' || res.user.email.includes('steven'),
                                referralCode: personalRefCode,
                                referredBy: null,
                                referralsCount: 0,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }

                    await this.fetchUserData(uid);
                    this.currentView = 'loyalty';
                } catch (err) {
                    console.error('handleGoogleAuth error', err);
                    this.authError = err.message || 'Google sign-in failed';
                }
            };

            // New handleAuth implementation (signup path with transactional referrals)
            state.handleAuth = async function () {
                this.authError = '';
                this.authSuccess = '';
                try {
                    if (this.authMode === 'signup') {
                        const res = await auth.createUserWithEmailAndPassword(this.authForm.email, this.authForm.password);
                        await res.user.sendEmailVerification();

                        const uid = res.user.uid;
                        const personalRefCode = generateReferralCode(uid);
                        const userRef = db.collection('clients').doc(uid);

                        // Determine referral code from form or localStorage
                        const enteredRefCode = (this.authForm.refCode || '').trim().toUpperCase();
                        const storedRef = enteredRefCode || localStorage.getItem('pendingReferral') || null;

                        let initialCoupons = [];
                        let referredByUid = null;

                        if (storedRef) {
                            try {
                                referredByUid = await applyReferralTransaction(db, storedRef, uid);
                                if (referredByUid) {
                                    initialCoupons.push({
                                        code: 'WELCOME-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                                        title: '$10 Off First Visit (Referral Bonus)',
                                        used: false,
                                        createdAt: new Date().toISOString()
                                    });
                                }
                            } catch (err) {
                                console.warn('Referral transaction failed during signup:', err);
                            }
                        }

                        // create user doc
                        await userRef.set({
                            name: this.authForm.name || '',
                            email: this.authForm.email,
                            phone: '',
                            address: '',
                            points: referredByUid ? 250 : 0,
                            lifetimePoints: referredByUid ? 250 : 0,
                            yearlyPoints: referredByUid ? 250 : 0,
                            statusYear: new Date().getFullYear().toString(),
                            coupons: initialCoupons,
                            pets: [{ name: '', notes: '', birthday: '', breed: '', photo: '' }],
                            isAdmin: this.authForm.email === 'saappleg@gmail.com' || (this.authForm.email && this.authForm.email.includes('steven')),
                            referralCode: personalRefCode,
                            referredBy: referredByUid || null,
                            referralsCount: 0,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        // clear pending referral
                        localStorage.removeItem('pendingReferral');

                        this.authSuccess = 'Account created! Please check your email to verify your address.';
                        this.authMode = 'login';
                    } else {
                        const res = await auth.signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
                        await res.user.reload();

                        const isGoogleUser = res.user.providerData.some(p => p.providerId === 'google.com');
                        this.isVerified = res.user.emailVerified || isGoogleUser;

                        if (!this.isVerified) {
                            this.authError = 'Please verify your email address to access the dashboard.';
                        }
                    }
                } catch (err) {
                    console.error('handleAuth error', err);
                    this.authError = err.message || 'Authentication failed';
                }
            };

            return state;
        };

        console.log('Runtime auth patches applied.');
    }).catch(err => {
        console.error('Could not apply runtime auth patches:', err);
    });
})();
</script>

</body>
</html>
