<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paw Points 🐾 | Pet Sitting Loyalty</title>
  
  <!-- Add Logo as Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & Configuration for Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class', // Enable dark mode by class
      theme: {
        extend: {
          colors: {
            amber: {
              50: '#fffbf0',
              // Add other amber shades as needed, but standard work well
            },
          },
        },
      },
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Firebase Web SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<!-- Alpine handles the theme state in local storage -->
<body x-data="pawPointsApp()" :class="{ 'dark': darkMode }" class="bg-amber-50 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

  <!-- Navigation -->
  <header class="bg-white dark:bg-slate-900 border-b border-amber-200 dark:border-slate-800 shadow-sm sticky top-0 z-10 transition-colors duration-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <!-- Logo Image - must be named 'logo.png' -->
        <img src="logo.png" alt="Paw Points Logo" class="w-10 h-10 object-contain" />
        <h1 class="text-2xl font-extrabold text-amber-900 dark:text-amber-500">Paw Points</h1>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- Theme Toggle Button -->
        <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-amber-100 dark:hover:bg-slate-800 transition-colors">
          <span x-show="!darkMode" class="text-xl">☀️</span>
          <span x-show="darkMode" class="text-xl">🌙</span>
        </button>

        <template x-if="user">
          <div class="flex items-center space-x-3">
            <span class="text-xs bg-amber-100 dark:bg-slate-800 text-amber-900 dark:text-amber-400 font-medium px-3 py-1 rounded-full" x-text="user.email"></span>
            <button @click="logout()" class="text-xs text-rose-600 hover:underline font-semibold">Log Out</button>
          </div>
        </template>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">

    <!-- AUTHENTICATION & PASSWORD RESET FORMS -->
    <template x-if="!user">
      <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-lg border border-amber-100 dark:border-slate-800 max-w-md mx-auto transition-colors duration-200">
        
        <!-- Logo on login screen -->
        <img src="logo.png" alt="Paw Points Logo" class="w-20 h-20 object-contain mx-auto mb-6" />

        <!-- Form titles -->
        <div class="text-center mb-6">
          <h2 x-show="isSignUp" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Create Account</h2>
          <h2 x-show="!isSignUp && !isForgotPassword" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Welcome Back</h2>
          <h2 x-show="isForgotPassword" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Reset Password</h2>
          
          <p x-show="isSignUp" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Sign up to start earning Paw Points</p>
          <p x-show="!isSignUp && !isForgotPassword" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Log in to view your balance and pets</p>
          <p x-show="isForgotPassword" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Enter your email and we'll send you a link to reset your password</p>
        </div>

        <!-- MAIN LOGIN / SIGN UP FORM -->
        <form x-show="!isForgotPassword" @submit.prevent="handleAuth()" class="space-y-4">
          <template x-if="isSignUp">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Your Full Name</label>
              <input type="text" x-model="authName" required class="form-input" placeholder="e.g. Alex Smith" />
            </div>
          </template>

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Email Address</label>
            <input type="email" x-model="authEmail" required class="form-input" placeholder="you@example.com" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400">Password</label>
              <!-- Forgot Password Link -->
              <button x-show="!isSignUp" @click="isForgotPassword = true" type="button" class="text-xs text-amber-700 dark:text-amber-500 font-medium hover:underline">Forgot?</button>
            </div>
            <input type="password" x-model="authPassword" required class="form-input" placeholder="••••••••" />
          </div>

          <button type="submit" class="w-full btn-primary text-sm transition-colors" x-text="isSignUp ? 'Register Account' : 'Log In'"></button>
        </form>

        <!-- PASSWORD RESET FORM -->
        <form x-show="isForgotPassword" @submit.prevent="handlePasswordReset()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Account Email</label>
            <input type="email" x-model="authEmail" required class="form-input" placeholder="your-account@example.com" />
          </div>
          <button type="submit" class="w-full btn-primary text-sm transition-colors">Send Reset Link</button>
          <div class="text-center mt-3">
            <button @click="isForgotPassword = false" type="button" class="text-xs text-slate-500 hover:underline">Back to Login</button>
          </div>
        </form>

        <!-- Footer links for switching between login/signup -->
        <div x-show="!isForgotPassword" class="text-xs text-center text-slate-500 mt-6">
          <span x-text="isSignUp ? 'Already have an account?' : 'Need an account?'"></span>
          <button @click="isSignUp = !isSignUp" class="text-amber-700 dark:text-amber-500 font-bold hover:underline ml-1" x-text="isSignUp ? 'Log In' : 'Sign Up'"></button>
        </div>
      </div>
    </template>

    <!-- CLIENT DASHBOARD (Logged In View) -->
    <template x-if="user">
      <div class="space-y-6">

        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-6 text-white shadow-xl flex justify-between items-center">
          <div>
            <p class="text-amber-100 text-xs font-medium uppercase tracking-wider">Account Balance</p>
            <h3 class="text-4xl font-extrabold mt-1" x-text="(userData?.points || 0).toLocaleString() + ' 🐾'"></h3>
            <p class="text-amber-100 text-xs mt-1" x-text="'10 points per $1 spent'"></p>
          </div>
          <div class="text-right">
            <span class="text-xs bg-white/20 text-white px-4 py-1.5 rounded-full font-semibold" x-text="userData?.name || 'Valued Client'"></span>
          </div>
        </div>

        <!-- PET INFORMATION SECTION -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow border border-amber-100 dark:border-slate-800 transition-colors duration-200">
          <div class="flex justify-between items-center mb-5">
            <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <span>🐶🐱 My Pets</span>
            </h3>
            <button @click="showAddPet = !showAddPet" class="text-xs bg-amber-100 dark:bg-slate-800 text-amber-900 dark:text-amber-400 font-semibold px-4 py-2 rounded-lg hover:bg-amber-200 dark:hover:bg-slate-700 transition-colors">
              <span x-text="showAddPet ? 'Cancel' : '+ Add Pet'"></span>
            </button>
          </div>

          <!-- Add Pet Form -->
          <div x-show="showAddPet" class="bg-amber-50/60 dark:bg-slate-800 p-5 rounded-xl border border-amber-200 dark:border-slate-700 mb-5 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <input type="text" x-model="newPet.name" placeholder="Pet Name (e.g. Fizz)" class="form-input text-sm" />
              <input type="text" x-model="newPet.type" placeholder="Type / Breed (e.g. Cat, Tabby)" class="form-input text-sm" />
            </div>
            <textarea x-model="newPet.notes" placeholder="Care notes, dietary info, or fun quirks..." class="w-full form-input text-sm" rows="2"></textarea>
            <button @click="savePet()" class="btn-primary px-5 py-2 text-xs font-medium">Save Pet</button>
          </div>

          <!-- Pet Cards List -->
          <div class="grid md:grid-cols-2 gap-5">
            <template x-for="pet in userData?.pets || []" :key="pet.name">
              <div class="border border-slate-200 dark:border-slate-700 rounded-xl p-5 bg-slate-50/50 dark:bg-slate-800 flex justify-between items-start transition-colors">
                <div>
                  <h4 class="font-bold text-lg text-slate-800 dark:text-slate-100" x-text="pet.name"></h4>
                  <p class="text-xs text-amber-800 dark:text-amber-400 font-medium" x-text="pet.type"></p>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 italic" x-text="pet.notes || 'No notes added.'"></p>
                </div>
              </div>
            </template>
            <template x-if="!userData?.pets?.length">
              <p class="text-xs text-slate-400 dark:text-slate-500 italic py-3">No pets added yet. Click "+ Add Pet" to tell us about your furry friends!</p>
            </template>
          </div>
        </div>

        <!-- REWARD REDEMPTION -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow border border-amber-100 dark:border-slate-800 transition-colors duration-200">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 mb-5">Available Rewards</h3>
          <div class="grid md:grid-cols-2 gap-5">
            
            <!-- $10 Off -->
            <div class="border border-slate-200 dark:border-slate-700 p-5 rounded-xl flex flex-col justify-between" :class="{'border-amber-500 bg-amber-50/40 dark:bg-slate-800': (userData?.points || 0) >= 5000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 dark:text-slate-100">$10 Off Next Sit</span>
                  <span class="text-xs bg-amber-200 dark:bg-slate-700 text-amber-900 dark:text-amber-400 px-2.5 py-1 rounded-full font-semibold">5,000 pts</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Requires $500 total spent in Walkies.</p>
              </div>
              <button 
                @click="redeemReward(5000, '$10 Off')"
                :disabled="(userData?.points || 0) < 5000"
                :class="(userData?.points || 0) >= 5000 ? 'btn-primary' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed'"
                class="mt-4 w-full py-2.5 rounded-lg font-medium text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

            <!-- $20 Off -->
            <div class="border border-slate-200 dark:border-slate-700 p-5 rounded-xl flex flex-col justify-between" :class="{'border-amber-500 bg-amber-50/40 dark:bg-slate-800': (userData?.points || 0) >= 8000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 dark:text-slate-100">$20 Off Next Sit</span>
                  <span class="text-xs bg-amber-200 dark:bg-slate-700 text-amber-900 dark:text-amber-400 px-2.5 py-1 rounded-full font-semibold">8,000 pts</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Best value! Requires $800 total spent.</p>
              </div>
              <button 
                @click="redeemReward(8000, '$20 Off')"
                :disabled="(userData?.points || 0) < 8000"
                :class="(userData?.points || 0) >= 8000 ? 'btn-primary' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed'"
                class="mt-4 w-full py-2.5 rounded-lg font-medium text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- Tailwind Component Classes for consistency across modes -->
  <style>
    @layer components {
      .form-input {
        @apply w-full px-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors duration-200;
      }
      .btn-primary {
        @apply bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-xl transition-colors duration-200;
      }
    }
  </style>

  <script>
    // *** REPLACE THIS OBJECT WITH YOUR FIREBASE CONFIG FROM FIREBASE CONSOLE ***
    const firebaseConfig = {
      apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E",
      authDomain: "paw-points-app.firebaseapp.com",
      projectId: "paw-points-app",
      storageBucket: "paw-points-app.firebasestorage.app",
      messagingSenderId: "252239990659",
      appId: "1:252239990659:web:627f4bd85785e0bdcfb0b6",
      measurementId: "G-6MPSER0Z6L"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function pawPointsApp() {
      return {
        // Theme state initialization from localStorage
        darkMode: localStorage.getItem('theme') === 'dark',
        user: null,
        userData: null,
        isSignUp: false,
        isForgotPassword: false, // New state for password reset form
        authName: '',
        authEmail: '',
        authPassword: '',
        showAddPet: false,
        newPet: { name: '', type: '', notes: '' },

        init() {
          auth.onAuthStateChanged(async (u) => {
            this.user = u;
            if (u) {
              this.fetchUserData();
            } else {
              this.userData = null;
            }
          });
        },

        // Theme switching logic
        toggleTheme() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
        },

        async fetchUserData() {
          const doc = await db.collection('clients').doc(this.user.uid).get();
          if (doc.exists) {
            this.userData = doc.data();
          }
        },

        async handleAuth() {
          try {
            if (this.isSignUp) {
              const res = await auth.createUserWithEmailAndPassword(this.authEmail, this.authPassword);
              await db.collection('clients').doc(res.user.uid).set({
                name: this.authName,
                email: this.authEmail,
                points: 0,
                pets: []
              });
            } else {
              await auth.signInWithEmailAndPassword(this.authEmail, this.authPassword);
            }
          } catch (err) {
            alert("Error: " + err.message);
          }
        },

        // New feature: Handle password reset emails via Firebase
        async handlePasswordReset() {
          if (!this.authEmail) return alert('Please enter your email first.');
          try {
            await auth.sendPasswordResetEmail(this.authEmail);
            alert(`A password reset link has been sent to ${this.authEmail}. Please check your inbox (and spam folder).`);
            this.isForgotPassword = false; // Go back to login screen
          } catch (err) {
            alert("Reset Error: " + err.message);
          }
        },

        async savePet() {
          if (!this.newPet.name) return alert('Pet name is required.');
          const pets = this.userData.pets || [];
          pets.push({ ...this.newPet });

          await db.collection('clients').doc(this.user.uid).update({ pets });
          this.userData.pets = pets;
          this.newPet = { name: '', type: '', notes: '' };
          this.showAddPet = false;
        },

        async redeemReward(cost, rewardName) {
          if (this.userData.points >= cost) {
            const newPoints = this.userData.points - cost;
            await db.collection('clients').doc(this.user.uid).update({ points: newPoints });
            this.userData.points = newPoints;
            alert(`Successfully redeemed ${rewardName}! We've deducted the points. We'll apply this discount to your next Walkies invoice automatically!`);
          }
        },

        logout() {
          auth.signOut();
        }
      };
    }
  </script>
</body>
</html>
