<!DOCTYPE html>
<html lang="en" x-data="pawApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw Points 🐾 Loyalty & Pet Care</title>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- QR Code Generator Library (With SRI Hash) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7BobhLK1BLQX0axhRi1DpSEvjfvqSpf54qo5YJkY9808URfc+AGmzpZp50E+8icT6xoj6251nqE1w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase Web SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navigation Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="Paw Points Logo" class="h-10 w-10 object-contain rounded-full bg-brand-50 p-1" onerror="this.src='https://via.placeholder.com/40?text=🐾'">
                <div>
                    <h1 class="font-bold text-lg leading-tight text-gray-900 dark:text-white">Paw Points 🐾</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Walkies Loyalty & Care</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Dark Mode Toggle -->
                <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <span x-show="!darkMode">🌙</span>
                    <span x-show="darkMode" x-cloak>☀️</span>
                </button>

                <!-- Auth Buttons -->
                <template x-if="user">
                    <button @click="logout()" class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-3 py-2 rounded-lg font-medium transition">
                        Log Out
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">

        <!-- Loading Spinner -->
        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand-600 border-t-transparent"></div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Loading your profile...</p>
        </div>

        <!-- AUTHENTICATION VIEW -->
        <div x-show="!loading && !user" x-cloak class="max-w-md mx-auto my-8 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md border border-gray-100 dark:border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-center" x-text="authMode === 'login' ? 'Welcome Back' : 'Create Account'"></h2>
            
            <form @submit.prevent="handleAuth()" class="space-y-4">
                <template x-if="authMode === 'signup'">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
                        <input type="text" x-model="authForm.name" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                </template>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                    <input type="email" x-model="authForm.email" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" x-model="authForm.password" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <p x-show="authError" x-text="authError" class="text-xs text-red-500 font-medium"></p>

                <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition shadow-sm" x-text="authMode === 'login' ? 'Log In' : 'Sign Up'"></button>
            </form>

            <div class="mt-4 text-center text-xs text-gray-500">
                <button @click="authMode = authMode === 'login' ? 'signup' : 'login'; authError = ''" class="text-brand-600 hover:underline">
                    <span x-text="authMode === 'login' ? 'Need an account? Sign up' : 'Already have an account? Log in'"></span>
                </button>
            </div>
        </div>

        <!-- LOGGED-IN DASHBOARD -->
        <template x-if="!loading && user">
            <div class="space-y-6">

                <!-- Admin Notice Banner -->
                <div x-show="isAdmin" class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-xs text-amber-800 dark:text-amber-200 font-medium">👑 Admin Mode Active</span>
                    <button @click="showAdminModal = true" class="text-xs bg-amber-600 text-white px-3 py-1 rounded-lg hover:bg-amber-700">Manage Client Points</button>
                </div>

                <!-- Points Banner & Digital Pass Trigger -->
                <div class="bg-gradient-to-r from-brand-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <p class="text-xs uppercase tracking-wider opacity-80 font-semibold">Your Balance</p>
                        <h2 class="text-4xl font-extrabold mt-1"><span x-text="userData.points || 0"></span> <span class="text-xl font-normal opacity-90">Pts</span></h2>
                        <p class="text-xs mt-2 opacity-90">Earn 10 points for every $1 spent on pet sitting & walks.</p>
                    </div>
                    <button @click="openDigitalPass()" class="w-full md:w-auto bg-white text-brand-600 hover:bg-brand-50 px-5 py-3 rounded-xl font-bold text-sm shadow transition flex items-center justify-center space-x-2">
                        <span>📱 Show Digital Pass</span>
                    </button>
                </div>

                <!-- Rewards Section -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <h3 class="font-bold text-base mb-4">Available Rewards</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Reward 1 -->
                        <div class="border dark:border-gray-700 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm">$10 Off Next Visit</h4>
                                <p class="text-xs text-gray-500">5,000 Points</p>
                            </div>
                            <button @click="redeemReward(5000, '$10 Off')" :disabled="(userData.points || 0) < 5000" class="px-3 py-1.5 rounded-lg text-xs font-bold transition" :class="(userData.points || 0) >= 5000 ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'">
                                Redeem
                            </button>
                        </div>
                        <!-- Reward 2 -->
                        <div class="border dark:border-gray-700 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm">$20 Off Next Visit</h4>
                                <p class="text-xs text-gray-500">8,000 Points</p>
                            </div>
                            <button @click="redeemReward(8000, '$20 Off')" :disabled="(userData.points || 0) < 8000" class="px-3 py-1.5 rounded-lg text-xs font-bold transition" :class="(userData.points || 0) >= 8000 ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'">
                                Redeem
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Pet & Vet Profile Section -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-base">Pet & Vet Details</h3>
                        <button @click="savePetDetails()" class="text-xs bg-brand-600 hover:bg-brand-700 text-white font-medium px-3 py-1.5 rounded-lg transition">
                            Save Info
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Pet Info -->
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Pet Profile</h4>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Pet Name(s)</label>
                                <input type="text" x-model="userData.petName" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Special Care Notes</label>
                                <textarea x-model="userData.petNotes" rows="3" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                            </div>
                        </div>

                        <!-- Vet Info -->
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Emergency Vet Info</h4>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Clinic Name</label>
                                <input type="text" x-model="userData.vetClinic" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Vet Phone Number</label>
                                <input type="text" x-model="userData.vetPhone" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </template>
    </main>

    <!-- Digital Pass QR Modal -->
    <div x-show="showQRModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div @click.away="showQRModal = false" class="bg-white dark:bg-gray-800 max-w-sm w-full p-6 rounded-2xl shadow-xl text-center space-y-4">
            <h3 class="font-bold text-lg">Your Paw Pass</h3>
            <p class="text-xs text-gray-500">Scan this code at checkout or visits to quickly access your account.</p>
            
            <div class="flex justify-center p-4 bg-white rounded-xl border border-gray-200">
                <div id="qrcode"></div>
            </div>

            <p class="text-xs font-mono text-gray-400" x-text="user?.uid"></p>

            <button @click="showQRModal = false" class="w-full py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-sm font-medium rounded-lg">
                Close
            </button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div x-show="showAdminModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div @click.away="showAdminModal = false" class="bg-white dark:bg-gray-800 max-w-md w-full p-6 rounded-2xl shadow-xl space-y-4">
            <h3 class="font-bold text-lg">Admin: Adjust Client Points</h3>
            
            <div>
                <label class="block text-xs text-gray-500 mb-1">Client User ID (UID)</label>
                <input type="text" x-model="adminForm.targetUid" placeholder="Paste Client UID here" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-500 mb-1">Points to Add / Subtract</label>
                <input type="number" x-model.number="adminForm.pointsDelta" placeholder="e.g. 100 or -50" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm outline-none">
            </div>

            <div class="flex space-x-2 pt-2">
                <button @click="showAdminModal = false" class="flex-1 py-2 bg-gray-200 dark:bg-gray-700 text-sm font-medium rounded-lg">Cancel</button>
                <button @click="updateClientPoints()" class="flex-1 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700">Update Points</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // 1. Firebase Configuration (REPLACE THESE KEYS WITH YOUR ACTUAL FIREBASE CONFIG)
        const firebaseConfig = {
            apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E",
            authDomain: "paw-points-app.firebaseapp.com",
            projectId: "paw-points-app",
            storageBucket: "paw-points-app.firebasestorage.app",
            messagingSenderId: "252239990659",
            appId: "1:252239990659:web:627f4bd85785e0bdcfb0b6",
            measurementId: "G-6MPSER0Z6L"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully!'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // 3. Alpine.js State Management
        function pawApp() {
            return {
                darkMode: localStorage.getItem('theme') === 'dark',
                loading: true,
                user: null,
                userData: {},
                isAdmin: false,
                authMode: 'login',
                authError: '',
                authForm: { name: '', email: '', password: '' },
                showQRModal: false,
                showAdminModal: false,
                adminForm: { targetUid: '', pointsDelta: 0 },
                qrInstance: null,

                init() {
                    // Auth state observer
                    auth.onAuthStateChanged(async (u) => {
                        this.user = u;
                        if (u) {
                            await this.fetchUserData(u.uid);
                        } else {
                            this.userData = {};
                            this.isAdmin = false;
                        }
                        this.loading = false;
                    });
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
                },

                async handleAuth() {
                    this.authError = '';
                    try {
                        if (this.authMode === 'signup') {
                            const res = await auth.createUserWithEmailAndPassword(this.authForm.email, this.authForm.password);
                            // Saved into 'clients' collection
                            await db.collection('clients').doc(res.user.uid).set({
                                name: this.authForm.name,
                                email: this.authForm.email,
                                points: 0,
                                isAdmin: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        } else {
                            await auth.signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
                        }
                    } catch (err) {
                        this.authError = err.message;
                    }
                },

                async fetchUserData(uid) {
                    // Updated to query 'clients' collection
                    const doc = await db.collection('clients').doc(uid).get();
                    if (doc.exists) {
                        this.userData = doc.data();
                        this.isAdmin = !!this.userData.isAdmin;
                    }
                },

                async savePetDetails() {
                    if (!this.user) return;
                    // Updated to update 'clients' collection
                    await db.collection('clients').doc(this.user.uid).update({
                        petName: this.userData.petName || '',
                        petNotes: this.userData.petNotes || '',
                        vetClinic: this.userData.vetClinic || '',
                        vetPhone: this.userData.vetPhone || ''
                    });
                    alert('Pet & Vet details saved successfully!');
                },

                async redeemReward(cost, title) {
                    if ((this.userData.points || 0) < cost) return;
                    if (confirm(`Redeem ${cost} points for ${title}?`)) {
                        const newBalance = this.userData.points - cost;
                        // Updated to update 'clients' collection
                        await db.collection('clients').doc(this.user.uid).update({ points: newBalance });
                        this.userData.points = newBalance;
                        alert(`Reward Redeemed! Show this to your sitter.`);
                    }
                },

                openDigitalPass() {
                    this.showQRModal = true;
                    this.$nextTick(() => {
                        const qrDiv = document.getElementById("qrcode");
                        qrDiv.innerHTML = "";
                        new QRCode(qrDiv, {
                            text: this.user.uid,
                            width: 160,
                            height: 160
                        });
                    });
                },

                async updateClientPoints() {
                    if (!this.adminForm.targetUid) return alert('Enter a valid User ID');
                    // Updated to target 'clients' collection
                    const targetRef = db.collection('clients').doc(this.adminForm.targetUid);
                    const doc = await targetRef.get();
                    
                    if (!doc.exists) return alert('Client not found!');
                    
                    const currentPts = doc.data().points || 0;
                    const newPts = currentPts + parseInt(this.adminForm.pointsDelta || 0);
                    
                    await targetRef.update({ points: newPts });
                    alert(`Updated client points from ${currentPts} to ${newPts}!`);
                    
                    if (this.adminForm.targetUid === this.user.uid) {
                        this.userData.points = newPts;
                    }
                    
                    this.showAdminModal = false;
                    this.adminForm = { targetUid: '', pointsDelta: 0 };
                },

                async logout() {
                    await auth.signOut();
                }
            }
        }
    </script>
</body>
</html>
