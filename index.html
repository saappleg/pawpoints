<!DOCTYPE html>
<html lang="en" x-data="pawApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw Points 🐾 Loyalty & Pet Care</title>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Reliable QR Code Generator CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Firebase Web SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navigation Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="Paw Points Logo" class="h-10 w-10 object-contain rounded-full bg-brand-50 p-1" onerror="this.src='https://via.placeholder.com/40?text=🐾'">
                <div>
                    <h1 class="font-bold text-lg leading-tight text-gray-900 dark:text-white">Paw Points 🐾</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Pet Care by Steven</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <span x-show="!darkMode">🌙</span>
                    <span x-show="darkMode" x-cloak>☀️</span>
                </button>

                <template x-if="user">
                    <button @click="logout()" class="text-xs bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-3 py-2 rounded-lg font-medium transition">
                        Log Out
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">

        <div x-show="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-brand-600 border-t-transparent"></div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Loading your profile...</p>
        </div>

        <!-- AUTHENTICATION VIEW -->
        <div x-show="!loading && !user" x-cloak class="max-w-md mx-auto my-8 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md border border-gray-100 dark:border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-center" x-text="authMode === 'login' ? 'Welcome Back' : 'Create Account'"></h2>
            
            <form @submit.prevent="handleAuth()" class="space-y-4">
                <template x-if="authMode === 'signup'">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Full Name</label>
                        <input type="text" x-model="authForm.name" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                </template>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                    <input type="email" x-model="authForm.email" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                    <input type="password" x-model="authForm.password" required class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <template x-if="authMode === 'signup'">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Referral Code (Optional)</label>
                        <input type="text" x-model="authForm.refCode" placeholder="e.g. PAW-12345" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none uppercase font-mono">
                    </div>
                </template>

                <p x-show="authError" x-text="authError" class="text-xs text-red-500 font-medium"></p>

                <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm transition shadow-sm" x-text="authMode === 'login' ? 'Log In' : 'Sign Up'"></button>
            </form>

            <div class="mt-4 text-center text-xs text-gray-500">
                <button @click="authMode = authMode === 'login' ? 'signup' : 'login'; authError = ''" class="text-brand-600 hover:underline">
                    <span x-text="authMode === 'login' ? 'Need an account? Sign up' : 'Already have an account? Log in'"></span>
                </button>
            </div>
        </div>

        <!-- LOGGED-IN DASHBOARD -->
        <template x-if="!loading && user">
            <div class="space-y-6">

                <!-- Admin Notice Banner -->
                <div x-show="isAdmin" class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-xs text-amber-800 dark:text-amber-200 font-medium">👑 Admin Mode Active</span>
                    <button @click="openAdminModal()" class="text-xs bg-amber-600 text-white px-3 py-1 rounded-lg hover:bg-amber-700">Manage Client Points</button>
                </div>

                <!-- Points Banner -->
                <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 border border-slate-800">
                    <div>
                        <p class="text-xs uppercase tracking-wider text-slate-400 font-bold">Your Balance</p>
                        <h2 class="text-4xl font-extrabold mt-1 text-white"><span x-text="userData.points || 0"></span> <span class="text-xl font-normal text-slate-300">Pts</span></h2>
                        <p class="text-xs mt-2 text-slate-300">Earn 10 points for every $1 spent on pet sitting & walks.</p>
                    </div>
                    <button @click="openDigitalPass()" class="w-full md:w-auto bg-brand-600 hover:bg-brand-700 text-white px-5 py-3 rounded-xl font-bold text-sm shadow transition flex items-center justify-center space-x-2">
                        <span>📱 Show Digital Pass</span>
                    </button>
                </div>

                <!-- 🎁 REFERRAL REWARDS CARD -->
                <div class="bg-gradient-to-r from-purple-600 to-brand-600 text-white p-6 rounded-2xl shadow-md space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] uppercase font-extrabold tracking-widest bg-white/20 px-2.5 py-1 rounded-full text-white">Earn Free Care</span>
                            <h3 class="font-extrabold text-xl mt-2">Refer a Friend, Get 1,000 Pts! 🎁</h3>
                            <p class="text-xs text-purple-100 mt-1 max-w-lg leading-relaxed">
                                Give your friends $10 off their first sitting or walk! When they sign up, you'll instantly receive **1,000 Paw Points** toward your next reward.
                            </p>
                        </div>
                        <div class="hidden sm:block text-right">
                            <span class="text-2xl font-black" x-text="userData.referralsCount || 0">0</span>
                            <p class="text-[10px] text-purple-200 uppercase font-bold tracking-wider">Friends Referred</p>
                        </div>
                    </div>

                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3 border border-white/20">
                        <div class="text-center sm:text-left">
                            <p class="text-[10px] uppercase tracking-wider text-purple-200 font-bold">Your Personal Referral Link</p>
                            <p class="font-mono text-sm font-bold text-white truncate max-w-xs sm:max-w-md" x-text="getReferralLink()"></p>
                        </div>
                        <button @click="copyReferralLink()" class="w-full sm:w-auto px-4 py-2 bg-white text-brand-700 font-bold rounded-lg text-xs hover:bg-purple-50 transition shadow-sm flex items-center justify-center gap-1">
                            <span x-text="copiedRef ? '✓ Copied!' : '📋 Copy Link'"></span>
                        </button>
                    </div>
                </div>

                <!-- 🐾 PET PROFILES & VET DETAILS SECTION -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-6">
                    
                    <!-- Panel Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b dark:border-gray-700 pb-4">
                        <div>
                            <h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-2">
                                <span>🐶 Pet Profiles & Care Details</span>
                            </h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Your pet photos, care routines, and emergency contacts for visits.</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <!-- STATIC VIEW ACTION -->
                            <template x-if="!isEditingPets">
                                <button @click="isEditingPets = true" class="text-xs bg-brand-600 hover:bg-brand-700 text-white font-bold px-4 py-1.5 rounded-lg shadow-sm transition">
                                    ✏️ Edit Information
                                </button>
                            </template>

                            <!-- EDITING MODE ACTIONS -->
                            <template x-if="isEditingPets">
                                <div class="flex items-center space-x-2">
                                    <button @click="cancelPetEdit()" class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold px-3 py-1.5 rounded-lg transition">
                                        Cancel
                                    </button>
                                    <button @click="addPet()" class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold px-3 py-1.5 rounded-lg transition">
                                        + Add Pet
                                    </button>
                                    <button @click="savePetDetails()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-1.5 rounded-lg shadow-sm transition">
                                        💾 Save Profiles
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 1. STATIC DISPLAY MODE (SAVED VIEW) -->
                    <div x-show="!isEditingPets" class="space-y-6">
                        <!-- Pet Cards Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <template x-for="(pet, index) in userData.pets" :key="index">
                                <div class="border dark:border-gray-700 rounded-xl p-4 bg-gray-50/60 dark:bg-gray-800/60 space-y-3">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-16 h-16 rounded-full overflow-hidden bg-gray-200 dark:bg-gray-700 flex-shrink-0 flex items-center justify-center border-2 border-brand-500 shadow-sm">
                                            <template x-if="pet.photo">
                                                <img :src="pet.photo" alt="Pet photo" class="w-full h-full object-cover">
                                            </template>
                                            <template x-if="!pet.photo">
                                                <span class="text-2xl">🐾</span>
                                            </template>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-base text-gray-900 dark:text-white" x-text="pet.name || 'Unnamed Pet'"></h4>
                                            <span class="text-[11px] font-semibold uppercase tracking-wider text-brand-600 dark:text-brand-400">Registered Pet</span>
                                        </div>
                                    </div>

                                    <div class="bg-white dark:bg-gray-900/50 p-3 rounded-lg border border-gray-100 dark:border-gray-700/50">
                                        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Care Notes & Routine</p>
                                        <p class="text-xs text-gray-700 dark:text-gray-300 whitespace-pre-line leading-relaxed" x-text="pet.notes || 'No special care instructions added yet.'"></p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Static Emergency Vet Info Banner -->
                        <div class="border-t dark:border-gray-700 pt-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">🏥 Emergency Vet Info</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50/60 dark:bg-gray-800/60 p-4 rounded-xl border dark:border-gray-700">
                                <div>
                                    <span class="block text-xs font-medium text-gray-400">Clinic Name</span>
                                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 mt-0.5" x-text="userData.vetClinic || 'Not specified'"></p>
                                </div>
                                <div>
                                    <span class="block text-xs font-medium text-gray-400">Vet Phone Number</span>
                                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 mt-0.5" x-text="userData.vetPhone || 'Not specified'"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. EDITABLE PANEL MODE (TEXTBOX VIEW) -->
                    <div x-show="isEditingPets" class="space-y-6" x-cloak>
                        <!-- Pet Cards Inputs Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <template x-for="(pet, index) in userData.pets" :key="index">
                                <div class="border dark:border-gray-700 rounded-xl p-4 bg-gray-50/50 dark:bg-gray-800/50 relative space-y-3">
                                    <button x-show="userData.pets.length > 1" @click="removePet(index)" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 text-xs font-bold p-1">
                                        ✕ Remove
                                    </button>

                                    <div class="flex items-center space-x-4">
                                        <!-- Pet Photo Avatar Input -->
                                        <div class="relative group flex-shrink-0">
                                            <div class="w-16 h-16 rounded-full overflow-hidden bg-gray-200 dark:bg-gray-700 flex items-center justify-center border-2 border-brand-500">
                                                <template x-if="pet.photo">
                                                    <img :src="pet.photo" alt="Pet photo" class="w-full h-full object-cover">
                                                </template>
                                                <template x-if="!pet.photo">
                                                    <span class="text-2xl">🐾</span>
                                                </template>
                                            </div>
                                            <label class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-pointer text-white text-[10px] font-bold">
                                                <span>Upload</span>
                                                <input type="file" accept="image/*" class="hidden" @change="uploadPetPhoto($event, index)">
                                            </label>
                                        </div>

                                        <div class="flex-grow">
                                            <label class="block text-xs font-bold text-gray-500 mb-1">Pet Name</label>
                                            <input type="text" x-model="pet.name" placeholder="e.g. Fizz, Buddy" class="w-full px-3 py-1.5 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-1">Special Care Notes / Breed / Routine</label>
                                        <textarea x-model="pet.notes" rows="2" placeholder="e.g. Loves treats, allergic to chicken, feed at 8 AM" class="w-full px-3 py-1.5 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Vet Info Input Banner -->
                        <div class="border-t dark:border-gray-700 pt-4 mt-4">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">🏥 Emergency Vet Info</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Clinic Name</label>
                                    <input type="text" x-model="userData.vetClinic" placeholder="e.g. Local Vet Hospital" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Vet Phone Number</label>
                                    <input type="text" x-model="userData.vetPhone" placeholder="e.g. (555) 123-4567" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Active Coupons Section -->
                <div x-show="userData.coupons && userData.coupons.length > 0" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <h3 class="font-bold text-base mb-3">Your Redeemed Coupons</h3>
                    <div class="space-y-3">
                        <template x-for="(coupon, index) in userData.coupons" :key="index">
                            <div class="border dark:border-gray-700 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2" :class="coupon.used ? 'bg-gray-50 dark:bg-gray-800/50 opacity-60' : 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800'">
                                <div>
                                    <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider" x-text="coupon.title"></span>
                                    <p class="font-mono text-lg font-extrabold tracking-widest text-gray-900 dark:text-white" :class="{ 'line-through text-gray-400': coupon.used }" x-text="coupon.code"></p>
                                    <p class="text-xs text-gray-400" x-text="'Redeemed: ' + new Date(coupon.createdAt).toLocaleDateString()"></p>
                                </div>
                                
                                <button 
                                    @click="toggleCouponUsed(index)" 
                                    :disabled="coupon.used"
                                    class="px-3 py-1.5 rounded-lg text-xs font-bold transition self-end sm:self-center" 
                                    :class="coupon.used ? 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400 cursor-not-allowed' : 'bg-emerald-600 text-white hover:bg-emerald-700'">
                                    <span x-text="coupon.used ? '🔒 Permanently Used' : 'Mark as Used'"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Rewards Section -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <h3 class="font-bold text-base mb-4">Available Rewards</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Reward 1 -->
                        <div class="border dark:border-gray-700 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm">$10 Off Next Visit</h4>
                                <p class="text-xs text-gray-500">5,000 Points</p>
                            </div>
                            <button @click="redeemReward(5000, '$10 Off Next Visit')" :disabled="(userData.points || 0) < 5000" class="px-3 py-1.5 rounded-lg text-xs font-bold transition" :class="(userData.points || 0) >= 5000 ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'">
                                Redeem
                            </button>
                        </div>
                        <!-- Reward 2 -->
                        <div class="border dark:border-gray-700 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-sm">$20 Off Next Visit</h4>
                                <p class="text-xs text-gray-500">8,000 Points</p>
                            </div>
                            <button @click="redeemReward(8000, '$20 Off Next Visit')" :disabled="(userData.points || 0) < 8000" class="px-3 py-1.5 rounded-lg text-xs font-bold transition" :class="(userData.points || 0) >= 8000 ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-gray-200 dark:bg-gray-700 text-gray-400 cursor-not-allowed'">
                                Redeem
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </template>
    </main>

    <!-- Digital Pass QR Modal -->
    <div x-show="showQRModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div @click.away="showQRModal = false" class="bg-white dark:bg-gray-800 max-w-sm w-full p-6 rounded-2xl shadow-xl text-center space-y-4">
            <h3 class="font-bold text-lg">Your Paw Pass</h3>
            <p class="text-xs text-gray-500">Scan this code at checkout or visits to quickly access your account.</p>
            
            <div class="flex justify-center p-4 bg-white rounded-xl border border-gray-200 min-h-[192px] items-center">
                <div id="qrcode"></div>
            </div>

            <p class="text-xs font-mono text-gray-400" x-text="user?.uid"></p>

            <button @click="showQRModal = false" class="w-full py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-sm font-medium rounded-lg">
                Close
            </button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div x-show="showAdminModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div @click.away="showAdminModal = false" class="bg-white dark:bg-gray-800 max-w-md w-full p-6 rounded-2xl shadow-xl space-y-4">
            <h3 class="font-bold text-lg">Admin: Adjust Client Points</h3>
            
            <div>
                <label class="block text-xs text-gray-500 mb-1">Select Client</label>
                <select x-model="adminForm.targetUid" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm outline-none">
                    <option value="">-- Choose a Client --</option>
                    <template x-for="c in clientList" :key="c.id">
                        <option :value="c.id" x-text="`${c.name || 'Unnamed Client'} (${c.email || c.id}) - Current: ${c.points || 0} Pts`"></option>
                    </template>
                </select>
            </div>

            <div>
                <label class="block text-xs text-gray-500 mb-1">Points to Add / Subtract</label>
                <input type="number" x-model.number="adminForm.pointsDelta" placeholder="e.g. 100 or -50" class="w-full px-3 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 text-sm outline-none">
            </div>

            <div class="flex space-x-2 pt-2">
                <button @click="showAdminModal = false" class="flex-1 py-2 bg-gray-200 dark:bg-gray-700 text-sm font-medium rounded-lg">Cancel</button>
                <button @click="updateClientPoints()" class="flex-1 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700">Update Points</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E",
            authDomain: "paw-points-app.firebaseapp.com",
            projectId: "paw-points-app",
            storageBucket: "paw-points-app.firebasestorage.app",
            messagingSenderId: "252239990659",
            appId: "1:252239990659:web:627f4bd85785e0bdcfb0b6",
            measurementId: "G-6MPSER0Z6L"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        reg.update();
                        console.log('Service Worker registered!');
                    })
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }

        function pawApp() {
            return {
                darkMode: localStorage.getItem('theme') === 'dark',
                loading: true,
                user: null,
                userData: {},
                isAdmin: false,
                isEditingPets: false,
                copiedRef: false,
                authMode: 'login',
                authError: '',
                authForm: { name: '', email: '', password: '', refCode: '' },
                showQRModal: false,
                showAdminModal: false,
                clientList: [],
                adminForm: { targetUid: '', pointsDelta: 0 },

                init() {
                    auth.onAuthStateChanged(async (u) => {
                        this.user = u;
                        if (u) {
                            await this.fetchUserData(u.uid);

                            const urlParams = new URLSearchParams(window.location.search);
                            const targetClientUid = urlParams.get('client');

                            if (targetClientUid && this.isAdmin) {
                                await this.fetchClientsList();
                                this.adminForm.targetUid = targetClientUid;
                                this.showAdminModal = true;
                            }
                        } else {
                            this.userData = {};
                            this.isAdmin = false;

                            // Auto-populate referral code if present in URL
                            const urlParams = new URLSearchParams(window.location.search);
                            const refParam = urlParams.get('ref');
                            if (refParam) {
                                this.authMode = 'signup';
                                this.authForm.refCode = refParam.toUpperCase();
                            }
                        }
                        this.loading = false;
                    });
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
                },

                async handleAuth() {
                    this.authError = '';
                    try {
                        if (this.authMode === 'signup') {
                            const res = await auth.createUserWithEmailAndPassword(this.authForm.email, this.authForm.password);
                            
                            // Generate unique personal referral code for the user
                            const personalRefCode = 'REF-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                            
                            let initialCoupons = [];
                            let referredByUid = null;

                            // Handle incoming referral logic
                            const enteredRefCode = (this.authForm.refCode || '').trim().toUpperCase();
                            if (enteredRefCode) {
                                const refQuery = await db.collection('clients').where('referralCode', '==', enteredRefCode).limit(1).get();
                                if (!refQuery.empty) {
                                    const referrerDoc = refQuery.docs[0];
                                    referredByUid = referrerDoc.id;

                                    // Give welcome discount to newly signed up client
                                    initialCoupons.push({
                                        code: 'WELCOME-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                                        title: '$10 Off First Visit (Referral Bonus)',
                                        used: false,
                                        createdAt: new Date().toISOString()
                                    });

                                    // Reward Referrer with 1,000 Points & update stats
                                    const refData = referrerDoc.data();
                                    await db.collection('clients').doc(referredByUid).update({
                                        points: (refData.points || 0) + 1000,
                                        referralsCount: (refData.referralsCount || 0) + 1
                                    });
                                }
                            }

                            await db.collection('clients').doc(res.user.uid).set({
                                name: this.authForm.name,
                                email: this.authForm.email,
                                points: 0,
                                coupons: initialCoupons,
                                pets: [{ name: '', notes: '', photo: '' }],
                                isAdmin: false,
                                referralCode: personalRefCode,
                                referredBy: referredByUid,
                                referralsCount: 0,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        } else {
                            await auth.signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
                        }
                    } catch (err) {
                        this.authError = err.message;
                    }
                },

                async fetchUserData(uid) {
                    const doc = await db.collection('clients').doc(uid).get();
                    if (doc.exists) {
                        this.userData = doc.data();
                        this.userData.coupons = this.userData.coupons || [];

                        // Ensure referral code exists for existing accounts
                        if (!this.userData.referralCode) {
                            const newRefCode = 'REF-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                            await db.collection('clients').doc(uid).update({ referralCode: newRefCode });
                            this.userData.referralCode = newRefCode;
                        }

                        if (!this.userData.pets || this.userData.pets.length === 0) {
                            this.userData.pets = [{
                                name: this.userData.petName || '',
                                notes: this.userData.petNotes || '',
                                photo: ''
                            }];
                        }
                        this.isAdmin = !!this.userData.isAdmin;
                    }
                },

                getReferralLink() {
                    if (!this.userData.referralCode) return 'Loading...';
                    return `${window.location.origin}${window.location.pathname}?ref=${this.userData.referralCode}`;
                },

                copyReferralLink() {
                    const link = this.getReferralLink();
                    navigator.clipboard.writeText(link).then(() => {
                        this.copiedRef = true;
                        setTimeout(() => this.copiedRef = false, 2500);
                    });
                },

                addPet() {
                    if (!this.userData.pets) this.userData.pets = [];
                    this.userData.pets.push({ name: '', notes: '', photo: '' });
                    this.isEditingPets = true;
                },

                removePet(index) {
                    if (this.userData.pets.length > 1) {
                        this.userData.pets.splice(index, 1);
                    }
                },

                uploadPetPhoto(event, index) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const img = new Image();
                    const reader = new FileReader();

                    reader.onload = (e) => {
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 300;
                            const MAX_HEIGHT = 300;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            this.userData.pets[index].photo = canvas.toDataURL('image/jpeg', 0.7);
                        };
                    };
                    reader.readAsDataURL(file);
                },

                async savePetDetails() {
                    if (!this.user) {
                        alert('You must be logged in to save pet details.');
                        return;
                    }

                    try {
                        const cleanedPets = (this.userData.pets || []).map(p => ({
                            name: p.name || '',
                            notes: p.notes || '',
                            photo: p.photo || ''
                        }));

                        await db.collection('clients').doc(this.user.uid).set({
                            pets: cleanedPets,
                            vetClinic: this.userData.vetClinic || '',
                            vetPhone: this.userData.vetPhone || ''
                        }, { merge: true });

                        this.isEditingPets = false;
                        alert('Pet profiles & vet details saved successfully!');
                    } catch (err) {
                        console.error('Failed to save pet details:', err);
                        alert(`Error saving profile: ${err.message}`);
                    }
                },

                async cancelPetEdit() {
                    if (this.user) {
                        await this.fetchUserData(this.user.uid);
                    }
                    this.isEditingPets = false;
                },

                async openAdminModal() {
                    this.showAdminModal = true;
                    await this.fetchClientsList();
                },

                async fetchClientsList() {
                    try {
                        const snapshot = await db.collection('clients').get();
                        this.clientList = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                    } catch (err) {
                        console.error('Failed to load clients list:', err);
                    }
                },

                async redeemReward(cost, title) {
                    if ((this.userData.points || 0) < cost) return;
                    if (confirm(`Redeem ${cost} points for ${title}?`)) {
                        const newBalance = this.userData.points - cost;
                        
                        const couponCode = 'PAW-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        const newCoupon = {
                            code: couponCode,
                            title: title,
                            used: false,
                            createdAt: new Date().toISOString()
                        };

                        const updatedCoupons = [...(this.userData.coupons || []), newCoupon];

                        await db.collection('clients').doc(this.user.uid).update({ 
                            points: newBalance,
                            coupons: updatedCoupons
                        });

                        this.userData.points = newBalance;
                        this.userData.coupons = updatedCoupons;

                        alert(`Reward Redeemed!\n\nYour Coupon Code is: ${couponCode}`);
                    }
                },

                async toggleCouponUsed(index) {
                    if (!this.user) return;

                    const coupon = this.userData.coupons[index];

                    if (coupon.used) {
                        alert('This coupon has already been used and cannot be changed.');
                        return;
                    }

                    if (confirm(`Are you sure you want to mark "${coupon.title}" (${coupon.code}) as USED?\n\nThis cannot be undone.`)) {
                        this.userData.coupons[index].used = true;
                        
                        await db.collection('clients').doc(this.user.uid).update({
                            coupons: this.userData.coupons
                        });
                    }
                },

                openDigitalPass() {
                    this.showQRModal = true;
                    this.$nextTick(() => {
                        const qrDiv = document.getElementById("qrcode");
                        qrDiv.innerHTML = "";
                        
                        const clientUrl = `${window.location.origin}${window.location.pathname}?client=${this.user.uid}`;
                        
                        if (typeof QRCode !== 'undefined') {
                            new QRCode(qrDiv, {
                                text: clientUrl,
                                width: 160,
                                height: 160
                            });
                        } else {
                            qrDiv.innerHTML = "<p class='text-xs text-red-500'>Failed to load QR generator.</p>";
                        }
                    });
                },

                async updateClientPoints() {
                    if (!this.adminForm.targetUid) return alert('Please select a client from the list.');
                    
                    const targetRef = db.collection('clients').doc(this.adminForm.targetUid);
                    const doc = await targetRef.get();
                    
                    if (!doc.exists) return alert('Client not found!');
                    
                    const currentPts = doc.data().points || 0;
                    const newPts = currentPts + parseInt(this.adminForm.pointsDelta || 0);
                    
                    await targetRef.update({ points: newPts });
                    alert(`Updated client points from ${currentPts} to ${newPts}!`);
                    
                    if (this.adminForm.targetUid === this.user.uid) {
                        this.userData.points = newPts;
                    }
                    
                    this.showAdminModal = false;
                    this.adminForm = { targetUid: '', pointsDelta: 0 };
                },

                async logout() {
                    await auth.signOut();
                }
            }
        }
    </script>
</body>
</html>
