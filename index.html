<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paw Points 🐾 | Pet Sitting Loyalty</title>
  
  <!-- Add Logo as Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Tailwind CSS & Configuration for Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Free QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase Web SDKs (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body x-data="pawPointsApp()" :class="{ 'dark': darkMode }" class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

  <!-- Navigation -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-0 z-10 transition-colors duration-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Paw Points Logo" class="w-10 h-10 object-contain" />
        <h1 class="text-2xl font-extrabold text-blue-900 dark:text-blue-400">Paw Points</h1>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- Theme Toggle Button -->
        <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <span x-show="!darkMode" class="text-xl">☀️</span>
          <span x-show="darkMode" class="text-xl">🌙</span>
        </button>

        <template x-if="user">
          <div class="flex items-center space-x-3">
            <span class="text-xs bg-blue-50 dark:bg-slate-800 text-blue-900 dark:text-blue-300 font-semibold px-3 py-1 rounded-full border border-blue-200 dark:border-slate-700" x-text="user.email"></span>
            <button @click="logout()" class="text-xs text-rose-600 dark:text-rose-400 hover:underline font-semibold">Log Out</button>
          </div>
        </template>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">

    <!-- AUTHENTICATION & PASSWORD RESET FORMS -->
    <template x-if="!user">
      <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-800 max-w-md mx-auto transition-colors duration-200">
        
        <img src="logo.png" alt="Paw Points Logo" class="w-20 h-20 object-contain mx-auto mb-6" />

        <div class="text-center mb-6">
          <h2 x-show="isSignUp" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Create Account</h2>
          <h2 x-show="!isSignUp && !isForgotPassword" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Welcome Back</h2>
          <h2 x-show="isForgotPassword" class="text-2xl font-bold text-slate-800 dark:text-slate-100">Reset Password</h2>
          
          <p x-show="isSignUp" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Sign up to start earning Paw Points</p>
          <p x-show="!isSignUp && !isForgotPassword" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Log in to view your balance and pets</p>
          <p x-show="isForgotPassword" class="text-slate-500 dark:text-slate-400 text-xs mt-1">Enter your email to receive a password reset link</p>
        </div>

        <!-- MAIN LOGIN / SIGN UP FORM -->
        <form x-show="!isForgotPassword" @submit.prevent="handleAuth()" class="space-y-4">
          <template x-if="isSignUp">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Your Full Name</label>
              <input type="text" x-model="authName" required class="form-input" placeholder="e.g. Alex Smith" />
            </div>
          </template>

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Email Address</label>
            <input type="email" x-model="authEmail" required class="form-input" placeholder="you@example.com" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400">Password</label>
              <button x-show="!isSignUp" @click="isForgotPassword = true" type="button" class="text-xs text-blue-600 dark:text-blue-400 font-medium hover:underline">Forgot?</button>
            </div>
            <input type="password" x-model="authPassword" required class="form-input" placeholder="••••••••" />
          </div>

          <button type="submit" class="w-full btn-primary text-sm transition-colors" x-text="isSignUp ? 'Register Account' : 'Log In'"></button>
        </form>

        <!-- PASSWORD RESET FORM -->
        <form x-show="isForgotPassword" @submit.prevent="handlePasswordReset()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Account Email</label>
            <input type="email" x-model="authEmail" required class="form-input" placeholder="your-account@example.com" />
          </div>
          <button type="submit" class="w-full btn-primary text-sm transition-colors">Send Reset Link</button>
          <div class="text-center mt-3">
            <button @click="isForgotPassword = false" type="button" class="text-xs text-slate-500 hover:underline">Back to Login</button>
          </div>
        </form>

        <div x-show="!isForgotPassword" class="text-xs text-center text-slate-500 mt-6">
          <span x-text="isSignUp ? 'Already have an account?' : 'Need an account?'"></span>
          <button @click="isSignUp = !isSignUp" class="text-blue-600 dark:text-blue-400 font-bold hover:underline ml-1" x-text="isSignUp ? 'Log In' : 'Sign Up'"></button>
        </div>
      </div>
    </template>

    <!-- CLIENT DASHBOARD (Logged In View) -->
    <template x-if="user">
      <div class="space-y-6">

        <!-- Balance Card -->
        <div class="bg-blue-950 dark:bg-slate-900 rounded-2xl p-6 text-white shadow-xl flex justify-between items-center border border-blue-900 dark:border-slate-800 transition-colors duration-200">
          <div>
            <p class="text-blue-300 dark:text-blue-400 text-xs font-bold uppercase tracking-wider">Account Balance</p>
            <h3 class="text-4xl font-black mt-1 text-white tracking-tight" x-text="(userData?.points || 0).toLocaleString() + ' 🐾'"></h3>
            <p class="text-blue-200 dark:text-slate-400 text-xs mt-1 font-medium" x-text="'10 points per $1 spent'"></p>
          </div>
          <div class="text-right space-y-2">
            <div>
              <span class="text-xs bg-blue-900 dark:bg-slate-800 border border-blue-700 dark:border-slate-700 text-white px-4 py-1.5 rounded-full font-semibold shadow-sm" x-text="userData?.name || 'Valued Client'"></span>
            </div>
            <!-- View Digital Pass Button -->
            <button @click="openPassModal()" class="inline-flex items-center gap-1.5 text-xs bg-white text-blue-950 font-bold px-3 py-1.5 rounded-xl hover:bg-blue-50 transition-colors shadow-sm">
              <span>💳</span>
              <span>Digital Pass</span>
            </button>
          </div>
        </div>

        <!-- DIGITAL WALLET PASS MODAL -->
        <div x-show="showPassModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" x-cloak>
          <div @click.away="showPassModal = false" class="bg-blue-950 text-white rounded-3xl max-w-sm w-full p-6 border-2 border-blue-800 shadow-2xl relative overflow-hidden space-y-6">
            
            <!-- Pass Header -->
            <div class="flex justify-between items-center pb-4 border-b border-blue-800/80">
              <div class="flex items-center space-x-2">
                <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain" />
                <span class="font-extrabold tracking-wide text-sm">PAW POINTS PASS</span>
              </div>
              <button @click="showPassModal = false" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <!-- Pass Body -->
            <div class="text-center space-y-2">
              <p class="text-xs text-blue-300 uppercase tracking-widest font-semibold">Member</p>
              <h4 class="text-xl font-bold text-white" x-text="userData?.name"></h4>
              
              <div class="pt-2">
                <p class="text-3xl font-black text-amber-400" x-text="(userData?.points || 0).toLocaleString() + ' PTS'"></p>
              </div>
            </div>

            <!-- Dynamic QR Code Container -->
            <div class="bg-white p-4 rounded-2xl flex justify-center items-center shadow-inner">
              <div id="qrcode"></div>
            </div>

            <div class="text-center space-y-1">
              <p class="text-[10px] text-blue-300 font-mono" x-text="'ID: ' + user?.uid"></p>
              <p class="text-[11px] text-blue-200 italic">Scan QR code at appointment to earn points!</p>
            </div>

            <button @click="showPassModal = false" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-2 rounded-xl text-xs font-semibold">
              Close Pass
            </button>
          </div>
        </div>

        <!-- PET INFORMATION SECTION -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 transition-colors duration-200">
          <div class="flex justify-between items-center mb-5">
            <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <span>🐶🐱 My Pets</span>
            </h3>
            <button @click="showAddPet = !showAddPet" class="text-xs bg-blue-50 dark:bg-slate-800 text-blue-900 dark:text-blue-300 font-semibold px-4 py-2 rounded-lg hover:bg-blue-100 dark:hover:bg-slate-700 transition-colors border border-blue-200 dark:border-slate-700">
              <span x-text="showAddPet ? 'Cancel' : '+ Add Pet'"></span>
            </button>
          </div>

          <!-- Add Pet Form -->
          <div x-show="showAddPet" class="bg-slate-50 dark:bg-slate-800/50 p-5 rounded-xl border border-slate-200 dark:border-slate-700 mb-5 space-y-4">
            <div class="grid md:grid-cols-2 gap-3">
              <input type="text" x-model="newPet.name" placeholder="Pet Name (e.g. Fizz)" class="form-input text-sm" />
              <input type="text" x-model="newPet.type" placeholder="Type / Breed (e.g. Cat, Tabby)" class="form-input text-sm" />
            </div>
            
            <input type="url" x-model="newPet.photoUrl" placeholder="Photo Link/URL (e.g. https://example.com/pet.jpg)" class="form-input text-sm" />

            <!-- Vet Info Inputs -->
            <div class="grid md:grid-cols-2 gap-3 pt-2 border-t border-slate-200 dark:border-slate-700">
              <input type="text" x-model="newPet.vetName" placeholder="Vet Clinic / Doctor Name" class="form-input text-sm" />
              <input type="tel" x-model="newPet.vetPhone" placeholder="Vet Phone Number" class="form-input text-sm" />
            </div>

            <textarea x-model="newPet.notes" placeholder="Care notes, dietary info, or fun quirks..." class="w-full form-input text-sm" rows="2"></textarea>
            <button @click="savePet()" class="btn-primary px-5 py-2 text-xs font-medium">Save Pet</button>
          </div>

          <!-- Pet Cards List -->
          <div class="grid md:grid-cols-2 gap-4">
            <template x-for="(pet, index) in userData?.pets || []" :key="index">
              <div class="border border-slate-200 dark:border-slate-700 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/60 flex flex-col justify-between transition-colors relative">
                
                <div>
                  <div class="flex items-center space-x-3 mb-3">
                    <template x-if="pet.photoUrl">
                      <img :src="pet.photoUrl" :alt="pet.name" class="w-12 h-12 rounded-full object-cover border-2 border-blue-600 shadow-sm" />
                    </template>
                    <template x-if="!pet.photoUrl">
                      <div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-slate-700 flex items-center justify-center text-xl">
                        🐾
                      </div>
                    </template>

                    <div>
                      <h4 class="font-bold text-base text-slate-800 dark:text-slate-100" x-text="pet.name"></h4>
                      <p class="text-xs text-blue-700 dark:text-blue-400 font-semibold" x-text="pet.type"></p>
                    </div>
                  </div>

                  <template x-if="pet.vetName || pet.vetPhone">
                    <div class="bg-white dark:bg-slate-900 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs mb-2 space-y-0.5">
                      <p class="font-bold text-slate-700 dark:text-slate-300">🏥 Vet Info:</p>
                      <p class="text-slate-600 dark:text-slate-400" x-text="pet.vetName || 'No clinic listed'"></p>
                      <p class="text-blue-600 dark:text-blue-400 font-semibold" x-text="pet.vetPhone ? '📞 ' + pet.vetPhone : ''"></p>
                    </div>
                  </template>

                  <p class="text-xs text-slate-600 dark:text-slate-400 italic" x-text="pet.notes || 'No notes added.'"></p>
                </div>

                <div class="mt-4 pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-end">
                  <button @click="deletePet(index)" class="text-xs text-rose-600 dark:text-rose-400 hover:underline font-semibold flex items-center gap-1">
                    🗑️ Remove Pet
                  </button>
                </div>

              </div>
            </template>

            <template x-if="!userData?.pets?.length">
              <p class="text-xs text-slate-500 dark:text-slate-400 italic py-2">No pets added yet. Click "+ Add Pet" to tell us about your furry friends!</p>
            </template>
          </div>
        </div>

        <!-- REWARD REDEMPTION -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 transition-colors duration-200">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 mb-5">Available Rewards</h3>
          <div class="grid md:grid-cols-2 gap-4">
            
            <!-- $10 Off -->
            <div class="border border-slate-200 dark:border-slate-700 p-5 rounded-xl flex flex-col justify-between" :class="{'border-blue-500 bg-blue-50/50 dark:bg-slate-800': (userData?.points || 0) >= 5000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 dark:text-slate-100">$10 Off Next Sit</span>
                  <span class="text-xs bg-blue-100 dark:bg-blue-900/60 text-blue-900 dark:text-blue-300 px-2.5 py-1 rounded-full font-bold">5,000 pts</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Requires $500 total spent in Walkies.</p>
              </div>
              <button 
                @click="redeemReward(5000, '$10 Off')"
                :disabled="(userData?.points || 0) < 5000"
                :class="(userData?.points || 0) >= 5000 ? 'btn-primary' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-600 cursor-not-allowed'"
                class="mt-4 w-full py-2.5 rounded-lg font-semibold text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

            <!-- $20 Off -->
            <div class="border border-slate-200 dark:border-slate-700 p-5 rounded-xl flex flex-col justify-between" :class="{'border-blue-500 bg-blue-50/50 dark:bg-slate-800': (userData?.points || 0) >= 8000}">
              <div>
                <div class="flex justify-between items-center mb-1">
                  <span class="font-bold text-slate-800 dark:text-slate-100">$20 Off Next Sit</span>
                  <span class="text-xs bg-blue-100 dark:bg-blue-900/60 text-blue-900 dark:text-blue-300 px-2.5 py-1 rounded-full font-bold">8,000 pts</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Best value! Requires $800 total spent.</p>
              </div>
              <button 
                @click="redeemReward(8000, '$20 Off')"
                :disabled="(userData?.points || 0) < 8000"
                :class="(userData?.points || 0) >= 8000 ? 'btn-primary' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-600 cursor-not-allowed'"
                class="mt-4 w-full py-2.5 rounded-lg font-semibold text-xs transition-colors">
                Redeem Reward
              </button>
            </div>

          </div>
        </div>

      </div>
    </template>

  </main>

  <style>
    [x-cloak] { display: none !important; }
    @layer components {
      .form-input {
        @apply w-full px-4 py-2.5 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-colors duration-200;
      }
      .btn-primary {
        @apply bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-xl transition-colors duration-200 shadow-sm;
      }
    }
  </style>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E",
      authDomain: "paw-points-app.firebaseapp.com",
      projectId: "paw-points-app",
      storageBucket: "paw-points-app.firebasestorage.app",
      messagingSenderId: "252239990659",
      appId: "1:252239990659:web:627f4bd85785e0bdcfb0b6",
      measurementId: "G-6MPSER0Z6L"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function pawPointsApp() {
      return {
        darkMode: localStorage.getItem('theme') === 'dark',
        user: null,
        userData: null,
        isSignUp: false,
        isForgotPassword: false,
        showPassModal: false,
        authName: '',
        authEmail: '',
        authPassword: '',
        showAddPet: false,
        newPet: { name: '', type: '', photoUrl: '', vetName: '', vetPhone: '', notes: '' },

        init() {
          auth.onAuthStateChanged(async (u) => {
            this.user = u;
            if (u) {
              this.fetchUserData();
            } else {
              this.userData = null;
            }
          });
        },

        toggleTheme() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('theme', this.darkMode ? 'dark' : 'light');
        },

        async fetchUserData() {
          const doc = await db.collection('clients').doc(this.user.uid).get();
          if (doc.exists) {
            this.userData = doc.data();
          }
        },

        openPassModal() {
          this.showPassModal = true;
          this.$nextTick(() => {
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // Clear old QR
            new QRCode(qrContainer, {
              text: `https://paw-points-app.firebaseapp.com/?clientUid=${this.user.uid}`,
              width: 160,
              height: 160,
              colorDark : "#0f172a",
              colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.H
            });
          });
        },

        async handleAuth() {
          try {
            if (this.isSignUp) {
              const res = await auth.createUserWithEmailAndPassword(this.authEmail, this.authPassword);
              await db.collection('clients').doc(res.user.uid).set({
                name: this.authName,
                email: this.authEmail,
                points: 0,
                pets: []
              });
            } else {
              await auth.signInWithEmailAndPassword(this.authEmail, this.authPassword);
            }
          } catch (err) {
            alert("Error: " + err.message);
          }
        },

        async handlePasswordReset() {
          if (!this.authEmail) return alert('Please enter your email first.');
          try {
            await auth.sendPasswordResetEmail(this.authEmail);
            alert(`A password reset link has been sent to ${this.authEmail}. Please check your inbox.`);
            this.isForgotPassword = false;
          } catch (err) {
            alert("Reset Error: " + err.message);
          }
        },

        async savePet() {
          if (!this.newPet.name) return alert('Pet name is required.');
          const pets = this.userData.pets || [];
          pets.push({ ...this.newPet });

          await db.collection('clients').doc(this.user.uid).update({ pets });
          this.userData.pets = pets;
          this.newPet = { name: '', type: '', photoUrl: '', vetName: '', vetPhone: '', notes: '' };
          this.showAddPet = false;
        },

        async deletePet(index) {
          if (confirm(`Are you sure you want to remove ${this.userData.pets[index].name}?`)) {
            const pets = [...this.userData.pets];
            pets.splice(index, 1);
            await db.collection('clients').doc(this.user.uid).update({ pets });
            this.userData.pets = pets;
          }
        },

        async redeemReward(cost, rewardName) {
          if (this.userData.points >= cost) {
            const newPoints = this.userData.points - cost;
            await db.collection('clients').doc(this.user.uid).update({ points: newPoints });
            this.userData.points = newPoints;
            alert(`Successfully redeemed ${rewardName}!`);
          }
        },

        logout() {
          auth.signOut();
        }
      };
    }
  </script>
</body>
</html>
