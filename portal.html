<!DOCTYPE html>
<html lang="en" x-data="portalApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Pet Care by Steven</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" sizes="512x512" href="logo.png">

    <!-- Tailwind & Firebase SDKs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        .rainbow-top-bar { height: 6px; background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">

    <div class="rainbow-top-bar sticky top-0 z-40"></div>

    <header class="bg-white dark:bg-gray-800 shadow-sm border-b dark:border-gray-700 sticky top-[6px] z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="font-bold text-lg text-gray-900 dark:text-white">🐾 Pet Care by Steven</a>
            <div class="flex items-center space-x-2">
                <a href="index.html" class="text-xs bg-gray-100 dark:bg-gray-700 px-3 py-2 rounded-lg font-bold">🏠 Home</a>
                <template x-if="user">
                    <button @click="logout()" class="text-xs bg-red-100 text-red-700 px-3 py-2 rounded-lg font-bold">Log Out</button>
                </template>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
        <div x-show="loading" class="text-center py-12">Loading Portal...</div>

        <!-- Login / Signup View -->
        <div x-show="!loading && !user" class="max-w-md mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md space-y-4">
            <h2 class="text-xl font-bold text-center" x-text="authMode === 'login' ? 'Client Login' : 'Create Account'"></h2>
            <button @click="handleGoogleAuth()" class="w-full py-2.5 px-4 bg-white border rounded-xl text-sm font-semibold flex items-center justify-center gap-2">Continue with Google</button>
            <form @submit.prevent="handleAuth()" class="space-y-3 text-xs">
                <input type="email" x-model="authForm.email" placeholder="Email Address" required class="w-full px-3 py-2 rounded border dark:bg-gray-700">
                <input type="password" x-model="authForm.password" placeholder="Password" required class="w-full px-3 py-2 rounded border dark:bg-gray-700">
                <button type="submit" class="w-full py-2.5 bg-brand-600 text-white font-bold rounded" x-text="authMode === 'login' ? 'Log In' : 'Sign Up'"></button>
            </form>
            <button @click="authMode = authMode === 'login' ? 'signup' : 'login'" class="text-xs text-brand-600 w-full text-center">Switch Mode</button>
        </div>

        <!-- Verified Dashboard -->
        <template x-if="user && isVerified">
            <div class="space-y-6">
                <div class="bg-slate-900 text-white p-6 rounded-2xl flex justify-between items-center">
                    <div>
                        <p class="text-xs uppercase text-slate-400">Paw Points Balance</p>
                        <h2 class="text-3xl font-black" x-text="`${userData.points || 0} Pts`"></h2>
                    </div>
                    <button @click="openDigitalPass()" class="bg-brand-600 px-4 py-2.5 rounded-xl font-bold text-xs">📱 Digital Pass</button>
                </div>

                <!-- Pet Profiles & Access -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-base">🐶 Pet Profiles & Home Access</h3>
                        <button @click="savePetDetails()" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-bold">Save Changes</button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <input type="text" x-model="userData.lockboxCode" placeholder="Lockbox / Keypad Code" class="w-full p-2 border rounded dark:bg-gray-700">
                        <textarea x-model="userData.vetClinic" placeholder="Emergency Vet Clinic Name" class="w-full p-2 border rounded dark:bg-gray-700"></textarea>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Digital Pass Modal -->
    <div x-show="showQRModal" x-cloak class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div @click.away="showQRModal = false" class="bg-white dark:bg-gray-800 p-6 rounded-2xl text-center space-y-4">
            <h3 class="font-bold">Your Paw Pass</h3>
            <div id="qrcode" class="flex justify-center"></div>
            <button @click="showQRModal = false" class="bg-gray-200 px-4 py-1.5 rounded text-xs">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAByvA8nPtXzfrQpkoh5XrBu9k3UdPzO7E", authDomain: "paw-points-app.firebaseapp.com", projectId: "paw-points-app" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        function portalApp() {
            return {
                darkMode: localStorage.getItem('theme') === 'dark',
                loading: true, user: null, userData: {}, isVerified: false,
                authMode: 'login', authForm: { email: '', password: '' }, showQRModal: false,
                init() {
                    auth.onAuthStateChanged(async (u) => {
                        this.user = u;
                        if (u) {
                            this.isVerified = true;
                            const doc = await db.collection('clients').doc(u.uid).get();
                            if (doc.exists) this.userData = doc.data();
                        }
                        this.loading = false;
                    });
                },
                async handleGoogleAuth() {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                },
                async handleAuth() {
                    if (this.authMode === 'signup') {
                        await auth.createUserWithEmailAndPassword(this.authForm.email, this.authForm.password);
                    } else {
                        await auth.signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
                    }
                },
                async savePetDetails() {
                    await db.collection('clients').doc(this.user.uid).set(this.userData, { merge: true });
                    alert('Saved!');
                },
                openDigitalPass() {
                    this.showQRModal = true;
                    this.$nextTick(() => {
                        document.getElementById("qrcode").innerHTML = "";
                        new QRCode(document.getElementById("qrcode"), { text: this.user.uid, width: 140, height: 140 });
                    });
                },
                logout() { auth.signOut(); }
            }
        }
    </script>
</body>
</html>
